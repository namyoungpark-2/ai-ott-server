# Oracle Ampere A1 VM 한 대에 API + Postgres + TLS 종단을 모두 올린다.
#
# 사용법 (VM 에서):
#   cd ai-ott-server/infra
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build

name: ai-ott

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    # 포트를 호스트로 노출하지 않는다. app 컨테이너만 내부 네트워크로 접근한다.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiott}
      POSTGRES_USER: ${POSTGRES_USER:-aiott}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      # 한국 시간대 기준 로그. 저장 값은 애플리케이션이 UTC 로 다룬다.
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiott} -d ${POSTGRES_DB:-aiott}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      # 컨텍스트가 저장소 루트여야 src/ 와 gradle 래퍼를 복사할 수 있다.
      context: ..
      dockerfile: infra/Dockerfile
    restart: always
    env_file: .env
    environment:
      # 컴포즈 내부 DNS 로 붙는다. .env 의 DB_URL 을 덮어써 실수를 막는다.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiott}
      DB_USERNAME: ${POSTGRES_USER:-aiott}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 트랜스코딩 임시 파일. 컨테이너를 다시 만들어도 진행 중 작업이 남도록 볼륨으로 둔다.
      - appdata:/app/data

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA 인증서(15년). setup.sh 안내대로 여기에 넣는다.
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
