# 테스트 전용 설정.
#
# 운영 설정(application.yml)에서 JWT_SECRET / ADMIN_* / OPS_* 의 기본값을 없앴기
# 때문에, 테스트에서는 여기서 더미 값을 채워야 컨텍스트가 로드된다.
# 이 값들은 테스트에서만 쓰이며 운영 경로에는 영향이 없다.
JWT_SECRET=test-only-secret-not-used-in-production-0123456789abcdef
ADMIN_USERNAME=test-admin
ADMIN_PASSWORD=test-admin-password
OPS_USERNAME=test-ops
OPS_PASSWORD=test-ops-password

# FlywayMigrationChecker 가 @Profile("!test") 이므로 이 프로파일에서 제외된다.
spring.profiles.active=test

# 테스트는 외부 DB에 붙지 않는다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
